<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>inka-yom2</title>
  </head>
  <body class="p-6">
    <!-- リフティング -->
    <div class="lot-section" data-category="lifting">
      <h3 class="text-2xl">インカ リフティングスリング</h3>
      <!-- 写真 -->
      <div class="flex gap-2 mt-4">
        <div class="card bg-base-100 w-64 shadow-sm">
          <figure class="h-32">
            <img
              src="./src/assets/INK4E-1.png"
              width="256"
              height="128"
              class="w-full h-full object-contain"
              alt="インカ リフティングスリング"
            />
          </figure>
        </div>

        <div class="card bg-base-100 w-64 shadow-sm">
          <figure class="h-32">
            <img
              src="./src/assets/INK4E-2.png"
              width="256"
              height="128"
              class="w-full h-full object-contain"
              alt="インカ リフティングスリング"
            />
          </figure>
        </div>
      </div>
      <div>
        <!-- デバッグ -->
        <p class="text-sm text-gray-500">デバッグ用サンプル入力</p>
        <div class="flex gap-2 flex-wrap">
          <button type="button" class="btn btn-sm debug-fill-btn" data-sample="2402001">和暦7桁</button>
          <button type="button" class="btn btn-sm debug-fill-btn" data-sample="25000106">西暦8桁</button>
          <button type="button" class="btn btn-sm debug-fill-btn" data-sample="2511-0001">西暦9桁</button>
          <button type="button" class="btn btn-sm debug-fill-btn" data-sample="250210">西暦6桁</button>
        </div>
      </div>
      <!-- 入力 -->
      <div class="pt-1 mt-2">
        <p>6桁から8桁の数字を入力してください｡ハイフンがある場合は略さず入力してください｡</p>
        <form class="lot-form flex gap-2" data-category="lifting">
          <input
            type="text"
            class="lot-input input input-bordered"
            placeholder="ロット番号を入力"
            inputmode="numeric"
          />
          <button type="submit" class="btn btn-primary">表示</button>
        </form>
        <p class="lot-result mt-2"></p>
      </div>
    </div>

<div class="divider"></div>


    <!-- ラウンド -->
    <div class="lot-section" data-category="round">
      <h3 class="text-2xl">インカ ラウンドスリング･シンスリング</h3>
      <!-- 写真 -->
      <div class="flex gap-2 mt-4">
        <div class="card bg-base-100 w-64 shadow-sm">
          <figure class="h-32">
            <img
              src="./src/assets/04_HN_01.png"
              width="256"
              height="128"
              class="w-full h-full object-contain"
              alt="インカ ラウンドスリング"
            />
          </figure>
        </div>

        <div class="card bg-base-100 w-64 shadow-sm">
          <figure class="h-32">
            <img
              src="./src/assets/thin.png"
              width="256"
              height="128"
              class="w-full h-full object-contain"
              alt="インカ ラウンドスリング"
            />
          </figure>
        </div>
      </div>
      <div>
        <!-- デバッグ -->
        <p class="text-sm text-gray-500">デバッグ用サンプル入力</p>
        <div class="flex gap-2 flex-wrap">
          <button type="button" class="btn btn-sm debug-fill-btn" data-sample="2508-1234H">10桁(西暦確定)</button>
          <button type="button" class="btn btn-sm debug-fill-btn" data-sample="170203">6桁(和暦確定)</button>
          <button type="button" class="btn btn-sm debug-fill-btn" data-sample="250203">6桁(重複ゾーン)</button>
          <button type="button" class="btn btn-sm debug-fill-btn" data-sample="24020">該当なし例</button>
        </div>
      </div>
      <!-- 入力 -->
      <div class="pt-1 mt-2">
        <p>10桁（yymm-xxxxH）または6桁の数字を入力してください（例：2508-1234H）｡</p>
        <label class="label cursor-pointer gap-2 w-fit">
          <input type="checkbox" class="checkbox qr-checkbox" />
          <span class="label-text">製品にQRコード（TMS）が付いている</span>
        </label>
        <form class="lot-form flex gap-2" data-category="round">
          <input
            type="text"
            class="lot-input input input-bordered"
            placeholder="ロット番号を入力"
            inputmode="text"
          />
          <button type="submit" class="btn btn-primary">表示</button>
        </form>
        <p class="lot-result mt-2"></p>
      </div>
    </div>

<div class="divider"></div>


    <!-- HRS -->
    <div class="lot-section" data-category="hrs">
      <h3 class="text-2xl">インカ HRS</h3>
      <!-- 写真 -->
      <div class="flex gap-2 mt-4">
        <div class="card bg-base-100 w-64 shadow-sm">
          <figure class="h-32">
            <img
              src="./src/assets/hrs-1.png"
              width="256"
              height="128"
              class="w-full h-full object-contain"
              alt="インカ HRS"
            />
          </figure>
        </div>
      </div>
      <div>
        <!-- デバッグ -->
        <p class="text-sm text-gray-500">デバッグ用サンプル入力</p>
        <div class="flex gap-2 flex-wrap">
          <button type="button" class="btn btn-sm debug-fill-btn" data-sample="1702034">和暦確定例</button>
          <button type="button" class="btn btn-sm debug-fill-btn" data-sample="2502001">重複ゾーン例</button>
          <button type="button" class="btn btn-sm debug-fill-btn" data-sample="123">該当なし例</button>
        </div>
      </div>
      <!-- 入力 -->
      <div class="pt-1 mt-2">
        <p>7桁の数字（eemmxxx）を入力してください｡</p>
        <label class="label cursor-pointer gap-2 w-fit">
          <input type="checkbox" class="checkbox qr-checkbox" />
          <span class="label-text">製品にQRコード（TMS）が付いている</span>
        </label>
        <form class="lot-form flex gap-2" data-category="hrs">
          <input
            type="text"
            class="lot-input input input-bordered"
            placeholder="ロット番号を入力"
            inputmode="numeric"
          />
          <button type="submit" class="btn btn-primary">表示</button>
        </form>
        <p class="lot-result mt-2"></p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
